; ESP32-S3 <-> Tello UDP bridge, BLE GATT peripheral side.
; Phase 1: tested from this PC via a Python (bleak) BLE-central script.
; Phase 2 (later): same GATT protocol, driven from a Spectacles Lens via
; BluetoothCentralModule instead of the Python test client.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = COM17
monitor_port = COM17
; ESP32-S3 has a native USB peripheral, not a separate USB-serial chip.
; Without this, esptool's own bootloader-mode USB-CDC still works fine for
; flashing, but the Arduino Serial object doesn't route through the same
; USB port after boot -- Serial.print() calls silently go nowhere visible.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
